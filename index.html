<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #15202b; display: flex; justify-content: center; padding: 20px; }
        .card { background: #192734; padding: 20px; border-radius: 16px; width: 100%; max-width: 400px; color: white; }
        .row { border-bottom: 1px solid #38444d; padding: 12px 0; }
        .label { display: block; font-size: 12px; color: #8899a6; margin-bottom: 4px; }
        .value { font-size: 16px; font-weight: bold; color: #ffffff; }
        .desc { margin: 10px 0; padding: 10px; background: #253341; border-radius: 8px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="row"><span class="label">Username</span><div class="value">@example</div></div>
        <div class="row"><span class="label">Followers</span><div class="value">1,234</div></div>
        <div class="row"><span class="label">Following</span><div class="value">567</div></div>
        <div class="row"><span class="label">Statuses</span><div class="value">8,901</div></div>
        <div class="row"><span class="label">Favourites</span><div class="value">2,345</div></div>
        <div class="row"><span class="label">Listed</span><div class="value">12</div></div>
        <div class="row"><span class="label">Verified</span><div class="value">Yes</div></div>
        <div class="row"><span class="label">Created At</span><div class="value">2023-01-01</div></div>
        <div class="desc">"Just a simple bio here."</div>
        <div class="row" style="border:none"><span class="label">Tweet</span><div class="value">Hello world!</div></div>
    </div>
</body>
</html>
